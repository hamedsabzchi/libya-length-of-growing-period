name: Rebuild GEE source

on:
  push:
    paths:
      - '.source/libya_lgp_mapping.js.gz.b64.part*'
      - '.github/workflows/rebuild-gee-source.yml'

permissions:
  contents: write

jobs:
  rebuild:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rebuild JavaScript source
        shell: bash
        run: |
          mkdir -p gee
          cat .source/libya_lgp_mapping.js.gz.b64.part1 \
              .source/libya_lgp_mapping.js.gz.b64.part2 \
              .source/libya_lgp_mapping.js.gz.b64.part3 \
              .source/libya_lgp_mapping.js.gz.b64.part4 \
            | base64 --decode \
            | gzip --decompress \
            > gee/libya_lgp_mapping.js
          python - <<'PY'
          from pathlib import Path
          p = Path('gee/libya_lgp_mapping.js')
          text = p.read_text(encoding='utf-8')
          assert p.stat().st_size == 68101
          assert 'By: Hamed Sabzchi Dehkharghani' in text
          assert 'NSL Geospatial Unit - Food and Agriculture Organization of the United Nations' not in text
          assert "ee.FeatureCollection('FAO/GAUL/2015/level0')" in text
          assert 'function annualLGP' in text
          assert 'function buildResult' in text
          assert 'function addDynamicMapSymbols' in text
          print('Rebuilt', p, 'bytes=', p.stat().st_size)
          PY
      - name: Commit reconstructed source
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add gee/libya_lgp_mapping.js
          if git diff --cached --quiet; then
            echo 'No changes to commit.'
          else
            git commit -m 'Add complete cleaned GEE LGP application'
            git push
          fi
