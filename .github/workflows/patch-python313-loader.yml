name: Patch Python 3.13 loader compatibility

on:
  push:
    paths:
      - '.github/workflows/patch-python313-loader.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch engine for importlib loaders
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('python/lgp_engine.py')
          text = p.read_text(encoding='utf-8')

          top_marker = 'import ee\n\n\n'
          top_block = '''import ee\n\n# Compatibility for dynamic importlib loaders that execute this module before\n# registering it in sys.modules (notably some Colab/Python 3.13 patterns).\nimport sys\nimport types\n\n_MODULE_PROXY = None\nif __name__ not in sys.modules:\n    _MODULE_PROXY = types.ModuleType(__name__)\n    _MODULE_PROXY.__dict__.update(globals())\n    sys.modules[__name__] = _MODULE_PROXY\n\n\n'''

          if '_MODULE_PROXY = None' not in text:
              if top_marker not in text:
                  raise SystemExit('Expected import marker not found')
              text = text.replace(top_marker, top_block, 1)

          bottom_block = '''\n\n# Keep the compatibility proxy complete for any later normal import.\nif _MODULE_PROXY is not None:\n    _MODULE_PROXY.__dict__.update(globals())\n'''
          if 'Keep the compatibility proxy complete' not in text:
              text = text.rstrip() + bottom_block + '\n'

          p.write_text(text, encoding='utf-8')
          PY
      - name: Commit patch
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add python/lgp_engine.py
          git commit -m 'Fix Python 3.13 dynamic loader compatibility'
          git push
